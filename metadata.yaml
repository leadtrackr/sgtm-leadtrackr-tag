    changeNotes: "Channel Flow can now run entirely from the server container, so a site on a first-party tagging server no longer needs the browser tag. Leads are sent to the authenticated endpoint with an API key, carry a click ID for every ad channel, and fill in user data, the event ID and attribution data from the incoming event automatically. Both tag types can be gated on Google Consent Mode."
